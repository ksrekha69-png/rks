<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Contact</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .info-icon {
            width: 50px;
            height: 50px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .info-details h4 {
            margin-bottom: 0.2rem;
        }
        .info-details p, .info-details a {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .info-details a:hover {
            color: var(--accent-color);
        }
        
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
            padding: 1rem;
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all var(--transition-speed);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08);
        }
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }
        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">Port<span>folio.</span></a>
            <button class="mobile-menu-btn">&#9776;</button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="certifications.html">Certifications</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container section">
        <div style="width: 100%;">
            <h2 class="section-title fade-in">Contact <span>Me</span></h2>
            
            <div class="contact-container">
                <div class="glass-card fade-in delay-1">
                    <div class="contact-info">
                        <div class="info-item">
                            <div class="info-icon">&#128231;</div>
                            <div class="info-details">
                                <h4>Email</h4>
                                <a href="mailto:hello@example.com">hello@example.com</a>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">&#128222;</div>
                            <div class="info-details">
                                <h4>Phone</h4>
                                <p>+1 234 567 8900</p>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">&#128205;</div>
                            <div class="info-details">
                                <h4>Location</h4>
                                <p>New York, USA</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card fade-in delay-2">
                    <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                        <div class="form-group">
                            <input type="text" class="form-control" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" class="form-control" placeholder="Your Email" required>
                        </div>
                        <div class="form-group">
                            <textarea class="form-control" placeholder="Your Message" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Portfolio. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
